<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Todo App</title>
		<link rel="stylesheet" href="css/style.css" />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
			integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
			crossorigin="anonymous"
			referrerpolicy="no-referrer"
		/>
	</head>
	<body>
		<header class="sect-container app-header">
			<h1><i class="fas fa-check-circle"></i>My Tasks</h1>
			<p id="date"></p>
		</header>

		<main class="sect-container app">
			<div class="todo-input">
				<div class="sect-container" data-type="narrow">
					<input type="text" id="task-input" placeholder="What do you need to do?" />
					<button id="add-task" class="btn btn-add">
						<i class="fas fa-plus"></i>
					</button>
				</div>
			</div>

			<div class="filters">
				<div class="sect-container" data-type="narrow">
					<div class="filter active" data-filter="all">All <span id="items-all" class="item-count"></span></div>
					<div class="filter" data-filter="active">Active <span id="items-active" class="item-count"></span></div>
					<div class="filter" data-filter="completed">Completed <span id="items-completed" class="item-count"></span></div>
				</div>
			</div>

			<div class="todos-container">
				<div class="sect-container" data-type="narrow">
					<ul id="todos-list">
						<!-- Sample li. Will be inserted later. -->
						<!-- <li class="todo-item">
							<label class="checkbox-container">
								<input type="checkbox" class="todo-checkbox" />
								<span class="checkmark"></span>
							</label>
							<span class="todo-item-text">Buy groceries</span>
							<button class="btn btn-delete">
								<i class="fas fa-times"></i>
							</button>
						</li> -->
					</ul>
					<div class="empty-state hidden">
						<i class="fas fa-clipboard-list"></i>
						<p>No tasks added yet!</p>
					</div>
				</div>
			</div>
		</main>

		<footer class="sect-container app-footer">
			<p id="items-left">0 items left</p>
			<button id="clear-completed">Clear completed</button>
		</footer>

		<script src="js/script.js"></script>
	</body>
</html>
